# =============================================================================
# yamllint
# =============================================================================
#
# Rules for `yamllint --strict` in CI: the default set without the `---`
# document marker and the line-length limit. `on` stays allowed as the GitHub
# Actions trigger key.

extends: default

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values: ["true", "false", "on"]
