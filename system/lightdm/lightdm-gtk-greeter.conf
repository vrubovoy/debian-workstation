# =============================================================================
# LightDM GTK Greeter
# =============================================================================
#
# Login screen configuration for Debian Workstation.
#
# Visual theme:
#   Graphite Blue
#
# GTK theme:
#   GraphiteBlue-LightDM
#
# Font:
#   Ubuntu Bold 16
#
# =============================================================================

[greeter]


# =============================================================================
# Appearance
# =============================================================================

# Custom GTK3 theme maintained by this repository.
theme-name=GraphiteBlue-LightDM

# Keep the standard Debian/GTK icon theme.
icon-theme-name=Adwaita

# Solid background matching the rest of the workstation.
background=#111318

# Never replace the configured background with a user's wallpaper.
user-background=false

# No background transition is needed for a static color.
transition-duration=0
transition-type=none


# =============================================================================
# Typography
# =============================================================================

font-name=Ubuntu Bold 16

xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb


# =============================================================================
# Login window
# =============================================================================

# Exact center of the active display.
position=50%,center 50%,center

# The login card is intentionally text-focused and minimal.
hide-user-image=true

# If user images are enabled in the future, keep them round.
round-user-image=true

# Highlight the currently logged-in user in multi-session scenarios.
highlight-logged-user=true


# =============================================================================
# Monitor handling
# =============================================================================

# Put the login dialog on the display containing the mouse pointer.
#
# Useful on multi-monitor systems and avoids hard-coding HDMI/DP names.
active-monitor=#cursor


# =============================================================================
# Top panel
# =============================================================================
#
# Keep only:
#
#   session selector | spacer | keyboard layout | clock | power
#
# Hostname, accessibility controls and language selection are intentionally
# omitted from the permanent panel.

panel-position=top

indicators=~session;~spacer;~layout;~clock;~power

clock-format=%d.%m.%Y  %H:%M

# Only the keyboard layouts actually used by this workstation.
keyboard-layouts=us;ru


# =============================================================================
# Security / idle
# =============================================================================

# Blank an unattended login screen after ten minutes.
screensaver-timeout=600

# Never enable greeter debugging on the normal workstation.
allow-debugging=false


# =============================================================================
# Default session
# =============================================================================

# Use i3 when no previous session has been selected.
default-session=i3