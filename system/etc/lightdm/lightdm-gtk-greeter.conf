# ******************************************************************************
# @file    lightdm-gtk-greeter.conf
# @author  Vrubovoy (github.com/vrubovoy)
# @brief   LightDM login screen with the GraphiteBlue-LightDM theme.
# @path    /etc/lightdm/lightdm-gtk-greeter.conf
# @apply   log out
# ******************************************************************************
# Copyright (c) 2026 Vrubovoy. MIT License, see LICENSE.
# ******************************************************************************

[greeter]
theme-name=GraphiteBlue-LightDM
icon-theme-name=Adwaita
background=#111318
user-background=false
transition-duration=0
transition-type=none

font-name=Maple Mono NR NF Bold 16
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb

position=50%,center 50%,center
hide-user-image=true
highlight-logged-user=true

# The monitor under the mouse pointer, whatever the outputs are called.
active-monitor=#cursor

panel-position=top
indicators=~session;~spacer;~layout;~clock;~power
clock-format=%d.%m.%Y  %H:%M
keyboard-layouts=us;ru

# Used until the user picks another session.
default-session=i3
