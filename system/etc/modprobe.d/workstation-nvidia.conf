# ******************************************************************************
# @file    workstation-nvidia.conf
# @author  Vrubovoy (github.com/vrubovoy)
# @brief   The NVIDIA driver keeps the video memory across suspend.
# @path    /etc/modprobe.d/workstation-nvidia.conf
# @apply   reboot
# ******************************************************************************
# Copyright (c) 2026 Vrubovoy. MIT License, see LICENSE.
# ******************************************************************************

# Debian renames the module to nvidia-current.
options nvidia-current NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
