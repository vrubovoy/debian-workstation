# =============================================================================
# Xorg — input devices
# =============================================================================
#
# libinput settings matched by device class, not by model, so they survive a
# new mouse or touchpad.
#
# Path:  /etc/X11/xorg.conf.d/90-workstation-input.conf
# Apply: log out and back in

# Touchpads: tap to click, natural scrolling; everything else at libinput defaults.
Section "InputClass"
    Identifier "Workstation touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "on"
EndSection

# Mice: adaptive acceleration, slightly slower. Wheel scrolling is not reversed.
Section "InputClass"
    Identifier "Workstation mouse"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    MatchIsTouchscreen "off"
    MatchIsTablet "off"
    Driver "libinput"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "-0.2"
EndSection
