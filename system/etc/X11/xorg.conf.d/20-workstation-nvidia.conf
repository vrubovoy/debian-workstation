# ******************************************************************************
# @file    20-workstation-nvidia.conf
# @author  Vrubovoy (github.com/vrubovoy)
# @brief   RGB on HDMI with the NVIDIA driver, instead of YCbCr 4:2:0.
# @path    /etc/X11/xorg.conf.d/20-workstation-nvidia.conf
# @apply   sudo systemctl restart lightdm
# ******************************************************************************
# Copyright (c) 2026 Vrubovoy. MIT License, see LICENSE.
# ******************************************************************************

# RGB on HDMI monitors whose EDID also offers YCbCr 4:2:0; some of them show
# 4:2:0 as a green, monochrome picture.
Section "OutputClass"
    Identifier "Workstation NVIDIA"
    MatchDriver "nvidia-drm"
    Option "ModeValidation" "NoEdidHDMI2Check"
EndSection
