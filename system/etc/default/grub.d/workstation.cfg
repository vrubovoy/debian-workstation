# =============================================================================
# GRUB — boot menu
# =============================================================================
#
# The boot menu over the wallpaper. scripts/install/system.sh writes the image,
# since GRUB reads only baseline JPEGs and the wallpaper is progressive.
#
# Path:  /etc/default/grub.d/workstation.cfg
# Apply: sudo update-grub

GRUB_BACKGROUND="/boot/grub/workstation.jpg"
