# =============================================================================
# Workstation input configuration
# =============================================================================
#
# Persistent X11/libinput input policy.
#
# This file deliberately uses device classes instead of product names or
# hardware IDs so the configuration survives replacement of the physical
# mouse or touchpad.
#
# Only behaviour which is intentionally part of the workstation policy is
# configured here. Device-specific sensitivity and unusual hardware quirks
# belong outside the base workstation configuration.
#
# =============================================================================


# =============================================================================
# Touchpad
# =============================================================================
#
# Preserve the interaction model used on the previous workstation:
#
#   - tap-to-click enabled;
#   - natural scrolling enabled.
#
# Click method, scroll method, acceleration and disable-while-typing remain at
# libinput defaults so hardware-specific defaults are preserved.

Section "InputClass"
    Identifier "Workstation touchpad"

    MatchIsTouchpad "on"

    Driver "libinput"

    Option "Tapping" "on"
    Option "NaturalScrolling" "on"
EndSection


# =============================================================================
# Mouse / pointer
# =============================================================================
#
# Preserve the previous workstation mouse acceleration:
#
#   profile: adaptive
#   speed:   -0.2
#
# Touchpads, touchscreens and tablets are excluded explicitly.
#
# Natural scrolling is intentionally not enabled for mouse wheels.

Section "InputClass"
    Identifier "Workstation mouse"

    MatchIsPointer "on"
    MatchIsTouchpad "off"
    MatchIsTouchscreen "off"
    MatchIsTablet "off"

    Driver "libinput"

    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "-0.2"
EndSection