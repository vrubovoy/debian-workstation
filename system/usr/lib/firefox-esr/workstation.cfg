// *****************************************************************************

// Maple Mono for every page instead of the fonts a site asks for.
defaultPref("browser.display.use_document_fonts", 0);

for (const family of ["monospace", "sans-serif", "serif"]) {
    for (const script of ["x-western", "x-cyrillic", "x-unicode"]) {
        defaultPref(`font.name.${family}.${script}`, "Maple Mono NR NF");
    }
}

const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
const css = Components.classes["@mozilla.org/network/io-service;1"]
    .getService(Components.interfaces.nsIIOService)
    .newURI("file:///usr/lib/firefox-esr/workstation-newtab.css");

if (!sss.sheetRegistered(css, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(css, sss.USER_SHEET);
}

// Default zoom, set only while the profile has none, so a zoom chosen in
// Settings stays.
const DEFAULT_ZOOM = 1.2;

Components.classes["@mozilla.org/observer-service;1"]
    .getService(Components.interfaces.nsIObserverService)
    .addObserver({
        observe() {
            const cps = Components.classes["@mozilla.org/content-pref/service;1"]
                .getService(Components.interfaces.nsIContentPrefService2);
            const context = Components.utils.createLoadContext();
            let found = false;

            cps.getGlobal("browser.content.full-zoom", context, {
                handleResult() {
                    found = true;
                },
                handleCompletion() {
                    if (!found) {
                        cps.setGlobal("browser.content.full-zoom", DEFAULT_ZOOM, context);
                    }
                },
            });
        },
    }, "final-ui-startup");
