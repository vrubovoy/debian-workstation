// *****************************************************************************
// @file    workstation.cfg
// @author  Vrubovoy (github.com/vrubovoy)
// @brief   Firefox AutoConfig: new tab style, Maple Mono and 120% zoom.
// @path    /usr/lib/firefox-esr/workstation.cfg
// @apply   restart Firefox
// *****************************************************************************
