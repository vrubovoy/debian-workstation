name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Node.js is needed only for the JSONC parser.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish i3-wm rofi shellcheck stow yamllint
          npm install --no-save --ignore-scripts --package-lock=false jsonc-parser@3.3.1

      # Pinned release, verified against the checksum published for v1.7.12.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" actionlint
          sudo install -m755 actionlint /usr/local/bin/actionlint

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check line endings
        run: |
          git add --renormalize .
          git diff --cached --exit-code

      - name: Check final newlines
        shell: bash
        run: |
          failed=false
          while IFS= read -r -d '' file; do
            if [[ -n "$(tail -c1 -- "$file")" ]]; then
              printf 'Missing final newline: %s\n' "$file" >&2
              failed=true
            fi
          done < <(git grep -zIl '')
          [[ "$failed" == false ]]

      - name: Check shell scripts
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          failed=false
          for file in "${files[@]}"; do
            bash -n "$file"
            # scripts/lib is sourced, not executed.
            if [[ "$file" != scripts/lib/* &&
                  "$(git ls-files --stage -- "$file" | cut -d' ' -f1)" != 100755 ]]; then
              printf 'Not executable: %s\n' "$file" >&2
              failed=true
            fi
          done
          shellcheck --severity=warning --external-sources "${files[@]}"
          [[ "$failed" == false ]]

      - name: Check Fish
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            fish --no-execute "$file"
          done < <(git ls-files -z '*.fish')

      # VSCodium's settings.json is JSONC despite its extension.
      - name: Check JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            [[ "$file" == */VSCodium/User/settings.json ]] && continue
            python3 -m json.tool "$file" >/dev/null
          done < <(git ls-files -z '*.json')

      - name: Check JSONC
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const jsonc = require("jsonc-parser");

          const files = execFileSync(
            "git",
            ["ls-files", "*.jsonc", "*/VSCodium/User/settings.json"],
            { encoding: "utf8" },
          ).split("\n").filter(Boolean);

          let failed = false;

          for (const file of files) {
            const errors = [];
            jsonc.parse(fs.readFileSync(file, "utf8"), errors, { allowTrailingComma: true });

            for (const error of errors) {
              console.error(`${file}: ${jsonc.printParseErrorCode(error.error)} at offset ${error.offset}`);
              failed = true;
            }
          }

          process.exit(failed ? 1 : 0);
          NODE

      - name: Check TOML
        run: |
          python3 <<'PY'
          import subprocess, tomllib

          for name in subprocess.check_output(["git", "ls-files", "*.toml"], text=True).split():
              with open(name, "rb") as handle:
                  tomllib.load(handle)
          PY

      - name: Check YAML
        run: yamllint --strict .

      - name: Check GitHub Actions
        run: actionlint

      - name: Check Rofi
        shell: bash
        run: |
          home="$(mktemp -d)"
          stow --no-folding --dir dotfiles --target "$home" rofi
          HOME="$home" rofi -rasi-validate "$home/.config/rofi/config.rasi"

      - name: Check i3
        run: i3 -C -c dotfiles/i3/.config/i3/config

  packages:
    name: Debian packages
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Runs the installer's own repository setup, then asks APT to resolve
      # every manifest without installing anything.
      - name: Resolve package manifests
        shell: bash
        run: |
          source scripts/install/system.sh
          setup_repositories
          install_packages --simulate >/dev/null

      - name: Check for duplicate packages
        shell: bash
        run: |
          source scripts/lib/common.sh
          duplicates="$(manifest packages/{base,desktop,applications,development}.txt | sort | uniq -d)"
          [[ -z "$duplicates" ]] || { printf 'Listed twice:\n%s\n' "$duplicates" >&2; exit 1; }
