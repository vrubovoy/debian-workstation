# ******************************************************************************

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version%%-*}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^(## )?\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { printf 'No section for %s in CHANGELOG.md\n' "${version%%-*}" >&2; exit 1; }

      - name: Build the PDF guides
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc weasyprint fonts-dejavu-core
          docs/guide/build.sh

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" docs/guide/*.pdf --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${flags[@]}"
