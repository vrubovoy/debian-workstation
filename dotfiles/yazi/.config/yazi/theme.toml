# =============================================================================
# Graphite Blue — Yazi
# =============================================================================
#
# Minimal theme matching:
#
#   i3
#   Kitty
#   Neovim
#   Rofi
#   Dunst
#   LightDM
#
# No Nerd Font dependency is required.
#
# =============================================================================


# =============================================================================
# Application
# =============================================================================

[app]

overall = { bg = "#111318" }


# =============================================================================
# Manager
# =============================================================================

[mgr]

cwd = { fg = "#7AA2F7", bold = true }

find_keyword = {
    fg = "#111318",
    bg = "#E5C07B",
    bold = true,
}

find_position = {
    fg = "#8E98A8",
    bg = "#111318",
}

symlink_target = {
    fg = "#56B6C2",
    italic = true,
}

marker_copied = {
    fg = "#98C379",
    bg = "#98C379",
}

marker_cut = {
    fg = "#E06C75",
    bg = "#E06C75",
}

marker_marked = {
    fg = "#E5C07B",
    bg = "#E5C07B",
}

marker_selected = {
    fg = "#7AA2F7",
    bg = "#7AA2F7",
}

count_copied = {
    fg = "#111318",
    bg = "#98C379",
    bold = true,
}

count_cut = {
    fg = "#111318",
    bg = "#E06C75",
    bold = true,
}

count_selected = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

border_symbol = "│"

border_style = {
    fg = "#303744",
}


# =============================================================================
# Pane indicator
# =============================================================================

[indicator]

parent = {
    fg = "#303744",
    bg = "#111318",
}

current = {
    fg = "#7AA2F7",
    bg = "#111318",
    bold = true,
}

preview = {
    fg = "#303744",
    bg = "#111318",
}

padding = {
    open = "",
    close = "",
}


# =============================================================================
# Tabs
# =============================================================================

[tabs]

active = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

inactive = {
    fg = "#8E98A8",
    bg = "#1A1D24",
}

# Plain separators: no Powerline/Nerd Font requirement.
sep_inner = {
    open = " ",
    close = " ",
}

sep_outer = {
    open = "",
    close = "",
}


# =============================================================================
# Modes
# =============================================================================

[mode]

normal_main = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

normal_alt = {
    fg = "#7AA2F7",
    bg = "#1A1D24",
}

select_main = {
    fg = "#111318",
    bg = "#E5C07B",
    bold = true,
}

select_alt = {
    fg = "#E5C07B",
    bg = "#1A1D24",
}

unset_main = {
    fg = "#111318",
    bg = "#E06C75",
    bold = true,
}

unset_alt = {
    fg = "#E06C75",
    bg = "#1A1D24",
}


# =============================================================================
# Status bar
# =============================================================================

[status]

overall = {
    fg = "#E6E9EF",
    bg = "#111318",
}

# No Powerline glyphs.
sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = { fg = "#7AA2F7" }
perm_read = { fg = "#98C379" }
perm_write = { fg = "#E5C07B" }
perm_exec = { fg = "#E06C75" }
perm_sep = { fg = "#5C6370" }

progress_label = {
    fg = "#E6E9EF",
    bold = true,
}

progress_normal = {
    fg = "#7AA2F7",
    bg = "#303744",
}

progress_error = {
    fg = "#E06C75",
    bg = "#303744",
}


# =============================================================================
# Key-hint popup
# =============================================================================

[which]

border = {
    fg = "#7AA2F7",
}

cols = 2

mask = {
    bg = "#111318",
}

cand = {
    fg = "#7AA2F7",
    bold = true,
}

rest = {
    fg = "#8E98A8",
}

desc = {
    fg = "#E6E9EF",
}

separator = " → "

separator_style = {
    fg = "#303744",
}


# =============================================================================
# Confirmation dialogs
# =============================================================================

[confirm]

border = {
    fg = "#E5C07B",
}

title = {
    fg = "#E5C07B",
    bold = true,
}

body = {
    fg = "#E6E9EF",
}

list = {
    fg = "#8E98A8",
}

btn_yes = {
    fg = "#111318",
    bg = "#E06C75",
    bold = true,
}

btn_no = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

btn_labels = [ "Yes", "No" ]


# =============================================================================
# File information
# =============================================================================

[spot]

border = {
    fg = "#7AA2F7",
}

title = {
    fg = "#7AA2F7",
    bold = true,
}

tbl_col = {
    fg = "#8E98A8",
}

tbl_cell = {
    fg = "#E6E9EF",
}


# =============================================================================
# Notifications
# =============================================================================

[notify]

title_info = {
    fg = "#7AA2F7",
    bold = true,
}

title_warn = {
    fg = "#E5C07B",
    bold = true,
}

title_error = {
    fg = "#E06C75",
    bold = true,
}


# =============================================================================
# Pickers
# =============================================================================

[pick]

border = {
    fg = "#7AA2F7",
}

active = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

inactive = {
    fg = "#8E98A8",
}


# =============================================================================
# Inputs
# =============================================================================

[input]

border = {
    fg = "#7AA2F7",
}

title = {
    fg = "#7AA2F7",
    bold = true,
}

value = {
    fg = "#E6E9EF",
}

selected = {
    fg = "#111318",
    bg = "#7AA2F7",
}


# =============================================================================
# Completion
# =============================================================================

[cmp]

border = {
    fg = "#7AA2F7",
}

active = {
    fg = "#111318",
    bg = "#7AA2F7",
    bold = true,
}

inactive = {
    fg = "#E6E9EF",
}

# Plain ASCII characters instead of Nerd Font icons.
icon_file = "F"
icon_folder = "D"
icon_command = ">"


# =============================================================================
# Tasks
# =============================================================================

[tasks]

border = {
    fg = "#7AA2F7",
}

title = {
    fg = "#7AA2F7",
    bold = true,
}

hovered = {
    fg = "#111318",
    bg = "#7AA2F7",
}


# =============================================================================
# Help
# =============================================================================

[help]

border = {
    fg = "#7AA2F7",
}

chord = {
    fg = "#7AA2F7",
    bold = true,
}

action = {
    fg = "#E6E9EF",
}

hovered = {
    fg = "#111318",
    bg = "#7AA2F7",
}


# =============================================================================
# File colors
# =============================================================================

[filetype]

rules = [

    # Broken symlinks.
    { url = "*", is = "orphan", fg = "#E06C75", bold = true },

    # Directories.
    { url = "*/", fg = "#7AA2F7", bold = true },

    # Symlinks.
    { url = "*", is = "link", fg = "#56B6C2" },

    # Executables.
    { url = "*", is = "exec", fg = "#98C379" },

    # Images.
    { mime = "image/*", fg = "#E5C07B" },

    # Audio / video.
    { mime = "{audio,video}/*", fg = "#C678DD" },

    # Archives.
    {
        mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd}",
        fg = "#D19A66",
    },

    # Generic files.
    { url = "*", fg = "#E6E9EF" },
]


# =============================================================================
# Icons
# =============================================================================
#
# Yazi enables Nerd Font icons by default.
#
# Ubuntu Mono Bold is intentionally retained as our terminal font, therefore
# all icon rules are explicitly disabled.

[icon]

globs = []
dirs = []
files = []
exts = []
conds = []