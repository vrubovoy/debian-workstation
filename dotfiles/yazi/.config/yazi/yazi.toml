# =============================================================================
# Yazi — file manager
# =============================================================================
#
# Terminal file manager. Images preview through Kitty graphics.
#
# Path:  ~/.config/yazi/yazi.toml

[mgr]
# parent | current | preview; the preview is wide for images.
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "no"
tab_size = 4
max_width = 1200
max_height = 900
# Avoids decoding images while scrolling quickly.
image_delay = 50
image_filter = "lanczos3"
image_quality = 80

[opener]
edit = [
    { run = '$EDITOR "$@"', block = true, desc = "Edit", for = "unix" },
]
open = [
    { run = 'xdg-open "$1"', orphan = true, desc = "Open", for = "linux" },
]

# Checked before Yazi's built-in rules; config formats are not always text/*.
[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.{json,jsonc,toml,yaml,yml,ini,conf}", use = "edit" },
]

[input]
cursor_blink = true
