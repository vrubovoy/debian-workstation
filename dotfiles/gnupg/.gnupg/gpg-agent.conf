# =============================================================================
# GnuPG agent
# =============================================================================
#
# Workstation passphrase handling.
#
# =============================================================================


# GTK graphical passphrase dialog.
pinentry-program /usr/bin/pinentry-gtk-2


# Cache the passphrase for 30 minutes after use.
default-cache-ttl 1800


# Never keep a cached passphrase for more than two hours.
max-cache-ttl 7200