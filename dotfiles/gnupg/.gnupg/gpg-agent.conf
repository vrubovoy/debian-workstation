# Passphrase prompts: GTK dialog in X, curses on a TTY.
pinentry-program /usr/bin/pinentry-gtk-2

# Ask for a passphrase once a session: the agent ends with it.
default-cache-ttl 34560000
max-cache-ttl 34560000
