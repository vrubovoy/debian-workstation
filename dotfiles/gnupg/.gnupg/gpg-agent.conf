# =============================================================================
# GnuPG agent
# =============================================================================
#
# Passphrase prompts and caching, used when Git signs commits.
#
# Path:  ~/.gnupg/gpg-agent.conf
# Apply: gpgconf --reload gpg-agent

# Passphrase prompts: GTK dialog in X, curses on a TTY.
pinentry-program /usr/bin/pinentry-gtk-2

# Cache a passphrase for 30 minutes after use, at most 2 hours.
default-cache-ttl 1800
max-cache-ttl 7200
