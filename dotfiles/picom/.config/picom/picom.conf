# Picom 12 — rounded corners, soft shadows, VSync and short fades. Windows stay
# fully opaque and there is no blur.

# GLX needs OpenGL 3.3. If a machine shows artifacts, use backend = "xrender".
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;

corner-radius = 12;
detect-rounded-corners = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
# Negative offsets center the shadow instead of dropping it down-right.
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#000000";
crop-shadow-to-monitor = true;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
no-fading-openclose = false;

frame-opacity = 1.0;

blur:
{
    method = "none";
};

# Unredirecting fullscreen windows can flicker when they change state.
unredir-if-possible = false;

log-level = "warn";

rules: (
    # The bar, the desktop and drag icons sit flush with the screen.
    {
        match = "window_type = 'dock'";
        shadow = false;
        corner-radius = 0;
        fade = false;
    },
    {
        match = "window_type = 'desktop'";
        shadow = false;
        corner-radius = 0;
        fade = false;
    },
    {
        match = "fullscreen";
        shadow = false;
        corner-radius = 0;
    },
    {
        match = "window_type = 'dnd'";
        shadow = false;
        corner-radius = 0;
        fade = false;
    },

    # Small surfaces get a smaller radius.
    {
        match = "window_type = 'tooltip'";
        shadow = true;
        corner-radius = 8;
        fade = true;
    },
    {
        match =
            "window_type = 'popup_menu' || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'menu'";
        shadow = true;
        corner-radius = 8;
        opacity = 1.0;
    },

    # Matches the corner_radius in dunstrc.
    {
        match = "window_type = 'notification'";
        shadow = true;
        corner-radius = 14;
        opacity = 1.0;
    },
    {
        match = "window_type = 'dialog'";
        shadow = true;
        corner-radius = 12;
        opacity = 1.0;
    }
);
