# =============================================================================
# Picom configuration
# =============================================================================
#
# Debian workstation X11 compositor.
#
# Design goals:
#   - Soft rounded corners.
#   - Subtle shadows which visually separate windows from the background.
#   - Tear-free rendering through VSync.
#   - Very short fade transitions.
#   - Fully opaque application windows.
#   - No blur and no decorative animation effects.
#   - Minimal hardware-specific behaviour.
#
# Theme:
#   Graphite Blue
#
# Picom version targeted by this configuration:
#   Debian 13 / Picom 12.5
#
# =============================================================================


# =============================================================================
# Rendering backend
# =============================================================================

# Use the OpenGL backend.
#
# GLX provides good VSync behaviour and is well suited to modern hardware.
# It requires working OpenGL 3.3 support, which is expected on modern desktop
# and laptop GPUs.
#
# If a particular machine ever exhibits rendering artifacts, XRender is the
# conservative fallback:
#
#   backend = "xrender";
#
backend = "glx";


# Synchronize rendering to the display refresh cycle.
#
# Prevents tearing while moving windows or scrolling.
vsync = true;


# Render only areas of the screen which have actually changed.
#
# This reduces unnecessary work and power consumption.
use-damage = true;


# Do not use higher precision/dithering during presentation.
#
# It is unnecessary for a normal desktop and costs additional GPU resources.
dithered-present = false;


# =============================================================================
# Window focus detection
# =============================================================================

# Detect application-provided opacity information.
#
# This allows programs which intentionally create transparent surfaces to work
# correctly without making ordinary windows transparent.
detect-client-opacity = true;


# Treat transient child windows as belonging to their parent application.
#
# Useful for dialogs, save/open windows and similar transient UI.
detect-transient = true;


# i3 implements EWMH correctly, so use _NET_ACTIVE_WINDOW as an additional
# reliable source for focused-window detection.
use-ewmh-active-win = true;


# =============================================================================
# Rounded corners
# =============================================================================

# Main desktop windows use soft rounded corners.
#
# 12 px visually matches the 10-16 px radii used by:
#
#   Rofi
#   Dunst
#   LightDM
#
# without becoming excessively rounded.
corner-radius = 12;


# Try to recognize windows which already provide their own rounded geometry.
detect-rounded-corners = true;


# =============================================================================
# Shadows
# =============================================================================

# Draw shadows around windows.
shadow = true;


# Soft shadow radius.
#
# Larger values produce a more diffuse shadow rather than a sharp outline.
shadow-radius = 18;


# Keep shadows intentionally subtle.
shadow-opacity = 0.28;


# Slightly center the shadow around the window instead of visibly shifting it
# down/right.
shadow-offset-x = -6;
shadow-offset-y = -6;


# Neutral black works better than a colored shadow with Graphite Blue.
shadow-color = "#000000";


# Do not allow a shadow belonging entirely to one monitor to bleed onto another
# monitor.
crop-shadow-to-monitor = true;


# =============================================================================
# Fading
# =============================================================================

# Enable short opacity transitions when windows appear/disappear.
#
# This is deliberately not a full animation system: geometry never slides,
# scales or bounces.
fading = true;


# Higher steps mean a shorter transition.
#
# With the default ~10 ms interval these settings result in a quick fade rather
# than an obvious animation.
fade-in-step = 0.08;
fade-out-step = 0.08;

fade-delta = 10;


# Allow fade when applications open and close.
no-fading-openclose = false;


# =============================================================================
# Opacity
# =============================================================================
#
# Ordinary windows remain completely opaque.
#
# We explicitly avoid:
#
#   inactive-opacity
#   active-opacity
#   inactive-dim
#
# because losing contrast in unfocused terminals/editors provides little
# practical value and makes the desktop visually noisy.

frame-opacity = 1.0;


# =============================================================================
# Blur
# =============================================================================
#
# Disabled intentionally.
#
# Most workstation windows are opaque, so blur provides little visual benefit.
# It also increases GPU work and introduces another source of driver-specific
# behaviour.
#
# Leaving this section explicitly disabled documents the decision.

blur:
{
    method = "none";
};


# =============================================================================
# Unredirection
# =============================================================================
#
# Picom can stop compositing when an opaque fullscreen application appears.
#
# In theory this can marginally improve performance, but redirect/unredirect
# transitions can cause flickering and visual glitches.
#
# Modern hardware does not justify that tradeoff for this workstation.

unredir-if-possible = false;


# =============================================================================
# Logging
# =============================================================================

# Only report actual warnings/errors during normal operation.
log-level = "warn";


# =============================================================================
# Window rules
# =============================================================================
#
# Picom 12.x supports rule-based configuration and recommends it over legacy
# exclusion arrays.
#
# Rules are evaluated for matching X11 windows.
#
# Useful window types:
#
#   normal
#   dialog
#   dock
#   desktop
#   popup_menu
#   dropdown_menu
#   tooltip
#   notification
#   dnd
#
# =============================================================================

rules: (


    # =========================================================================
    # i3bar and other docks
    # =========================================================================
    #
    # Panels occupy a fixed screen edge and should visually connect directly
    # with that edge rather than appearing as floating cards.

    {
        match = "window_type = 'dock'";

        shadow = false;
        corner-radius = 0;

        fade = false;
    },


    # =========================================================================
    # Desktop windows
    # =========================================================================
    #
    # Wallpaper/desktop surfaces must fill the screen exactly.

    {
        match = "window_type = 'desktop'";

        shadow = false;
        corner-radius = 0;

        fade = false;
    },


    # =========================================================================
    # Fullscreen applications
    # =========================================================================
    #
    # Rounded corners make no sense for a window which intentionally occupies
    # the entire display.
    #
    # Removing shadows also avoids unnecessary rendering around fullscreen
    # video or games.

    {
        match = "fullscreen";

        shadow = false;
        corner-radius = 0;
    },


    # =========================================================================
    # Drag-and-drop helper windows
    # =========================================================================

    {
        match = "window_type = 'dnd'";

        shadow = false;
        corner-radius = 0;

        fade = false;
    },


    # =========================================================================
    # Tooltips
    # =========================================================================
    #
    # Small UI surfaces benefit from a lighter radius and a compact shadow.

    {
        match = "window_type = 'tooltip'";

        shadow = true;
        corner-radius = 8;

        fade = true;
    },


    # =========================================================================
    # Popup / dropdown menus
    # =========================================================================
    #
    # GTK/Qt menus remain fully opaque but visually float above their parent
    # window.

    {
        match =
            "window_type = 'popup_menu' || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'menu'";

        shadow = true;
        corner-radius = 8;

        opacity = 1.0;
    },


    # =========================================================================
    # Notifications
    # =========================================================================
    #
    # Dunst already renders rounded Graphite Blue cards.
    # Picom provides only the depth/shadow around those cards.

    {
        match = "window_type = 'notification'";

        shadow = true;
        corner-radius = 14;

        opacity = 1.0;
    },


    # =========================================================================
    # Dialogs
    # =========================================================================

    {
        match = "window_type = 'dialog'";

        shadow = true;
        corner-radius = 12;

        opacity = 1.0;
    }
);


# =============================================================================
# Deliberately omitted features
# =============================================================================
#
# WINDOW TRANSPARENCY
#
#   No global active/inactive opacity changes.
#
#   A terminal, browser or editor should remain equally readable regardless of
#   whether it currently has focus.
#
#
# INACTIVE DIMMING
#
#   i3 already indicates focus using its blue border.
#   Dimming the entire window duplicates that information.
#
#
# BACKGROUND BLUR
#
#   Disabled for performance, predictability and readability.
#
#
# COMPLEX ANIMATIONS
#
#   Picom 12.x supports additional animation machinery, but this workstation
#   deliberately uses only short fades.
#
#   Window geometry should respond immediately to i3 commands.
#
#
# CUSTOM SHADERS
#
#   No visual requirement justifies maintaining GLSL shaders in a long-lived
#   workstation repository.
#
#
# DBUS REMOTE CONTROL
#
#   Disabled because the current desktop has no component which requires it.
#
# =============================================================================