# =============================================================================
# Kitty configuration
# =============================================================================
#
# Debian workstation terminal configuration.
#
# Design goals:
#   - Large and highly readable typography.
#   - Minimal, dark and consistent appearance.
#   - Keyboard-first workflow.
#   - Correct behaviour with both US and RU keyboard layouts.
#   - No dependency on external theme/framework configuration.
#   - Configuration should remain understandable years later.
#
# Theme:
#   Graphite Blue
#
# Font:
#   Ubuntu Mono Bold
#
# =============================================================================


# =============================================================================
# Fonts
# =============================================================================

# Use the bold face as the normal terminal font.
#
# This is intentional: terminal text should be large, dense and immediately
# readable rather than thin or decorative.
font_family      Ubuntu Mono Bold
bold_font        Ubuntu Mono Bold
italic_font      Ubuntu Mono Bold Italic
bold_italic_font Ubuntu Mono Bold Italic

# Large terminal text.
font_size 16.0


# =============================================================================
# Cursor
# =============================================================================

# Applications may override the cursor shape. Kitty shell integration, for
# example, uses a beam cursor while editing a shell command.
cursor_shape block

# Show a hollow cursor when this Kitty window does not have keyboard focus.
cursor_shape_unfocused hollow

# Smooth blinking instead of an abrupt on/off cursor.
cursor_blink_interval 0.5 ease-in-out

# Cursor trail makes large cursor jumps easier to follow visually.
#
# The old configuration used an extremely aggressive value of 1 ms.
# 50 ms keeps the effect while avoiding trails during tiny rapid movements.
cursor_trail 50

cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2


# =============================================================================
# Window spacing
# =============================================================================

# Blank space between terminal text and the edge of the Kitty window.
#
# The old configuration used 25 pt. Under i3 we already have 10 px window
# gaps, therefore 14 pt keeps the terminal spacious without wasting too much
# screen area.
window_padding_width 14

# Let i3 be solely responsible for window decorations.
hide_window_decorations yes


# =============================================================================
# Window behaviour
# =============================================================================

# Fully opaque terminal.
#
# Transparency can be reconsidered later together with Picom. Keeping Kitty
# opaque for now ensures maximum readability and makes the terminal independent
# from compositor behaviour.
background_opacity 1.0

# Ask before closing Kitty only when a real command is still running.
#
# With shell integration enabled, idle shell prompts do not count.
confirm_os_window_close -1

# Do not produce audible terminal bells.
enable_audio_bell no

# Do not flash the whole terminal as a replacement for the audio bell.
visual_bell_duration 0.0


# =============================================================================
# Scrollback
# =============================================================================

# Keep enough history for normal development and command-line work.
#
# Kitty allocates scrollback memory on demand.
scrollback_lines 10000

# Allow smooth per-pixel scrolling with touchpads.
pixel_scroll yes

# When a terminal window becomes taller, use old scrollback contents to fill
# the newly exposed area instead of leaving it blank.
scrollback_fill_enlarged_window yes


# =============================================================================
# Selection and clipboard
# =============================================================================

# Do not automatically place every mouse selection into the regular clipboard.
#
# X11 already provides the PRIMARY selection for mouse-based workflows and
# explicit Ctrl+Shift+C remains predictable.
copy_on_select no

# Remove trailing spaces for ordinary selections while preserving them for
# rectangular selections where whitespace may be significant.
strip_trailing_spaces smart

# Keep Kitty's protection against pastes containing terminal control codes.
paste_actions quote-urls-at-prompt,confirm


# =============================================================================
# URLs and hyperlinks
# =============================================================================

# Detect plain-text URLs automatically.
detect_urls yes

# Underline detected URLs.
url_style single

# Allow OSC 8 hyperlinks emitted by terminal programs.
allow_hyperlinks yes


# =============================================================================
# Shell integration
# =============================================================================

# Enable Kitty's native integration with supported shells.
#
# With Fish this provides, among other things:
#   - prompt awareness;
#   - current-directory tracking;
#   - jumping between previous prompts;
#   - viewing previous command output;
#   - improved resizing behaviour;
#   - current directory information for new Kitty windows/tabs.
shell_integration enabled


# =============================================================================
# Tab bar
# =============================================================================
#
# Kitty tabs are independent from i3 workspaces.
#
# They remain useful when several closely related shells belong to the same
# terminal task.

# Keep the tab bar at the bottom, matching the previous workflow.
tab_bar_edge bottom

# Continuous Powerline-style tabs.
tab_bar_style powerline

# Slanted separators preserve the visual style of the previous configuration.
tab_powerline_style slanted

# Do not waste excessive horizontal space on very long shell/window titles.
tab_title_max_length 36

# Display the title and show the number of Kitty windows in the tab only when
# there is more than one.
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Graphite Blue tab colors.
active_tab_foreground   #111318
active_tab_background   #7AA2F7
active_tab_font_style   bold

inactive_tab_foreground #8E98A8
inactive_tab_background #1A1D24
inactive_tab_font_style normal

tab_bar_background      #111318


# =============================================================================
# Graphite Blue theme
# =============================================================================
#
# The palette shares the same core colors as i3:
#
#   background  #111318
#   surface     #1A1D24
#   foreground  #E6E9EF
#   muted       #8E98A8
#   accent      #7AA2F7
#   urgent      #E06C75
#
# ANSI colors below provide enough distinction for compilers, Git, editors,
# diagnostic tools and TUIs without turning the terminal into a rainbow.


# -----------------------------------------------------------------------------
# Base colors
# -----------------------------------------------------------------------------

foreground #E6E9EF
background #111318


# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------

selection_foreground #E6E9EF
selection_background #303744


# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

cursor            #7AA2F7
cursor_text_color #111318


# -----------------------------------------------------------------------------
# URLs
# -----------------------------------------------------------------------------

url_color #7AA2F7


# -----------------------------------------------------------------------------
# Kitty internal window borders
# -----------------------------------------------------------------------------

active_border_color   #7AA2F7
inactive_border_color #303744
bell_border_color     #E06C75


# -----------------------------------------------------------------------------
# ANSI palette
# -----------------------------------------------------------------------------
#
# Normal colors: 0-7
# Bright colors: 8-15

# Black
color0  #1A1D24
color8  #5C6370

# Red
color1  #E06C75
color9  #F07178

# Green
color2  #98C379
color10 #B5E890

# Yellow
color3  #E5C07B
color11 #FFD580

# Blue
color4  #7AA2F7
color12 #89B4FA

# Magenta
color5  #C678DD
color13 #D2A6FF

# Cyan
color6  #56B6C2
color14 #7DCFFF

# White
color7  #C8CCD4
color15 #E6E9EF


# =============================================================================
# Clipboard key bindings
# =============================================================================
#
# Explicit bindings are provided for both keyboard layouts.
#
# This avoids the common problem where Ctrl+Shift+C / Ctrl+Shift+V stop
# working after switching from US to RU.


# -----------------------------------------------------------------------------
# Copy — US layout
# -----------------------------------------------------------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+C copy_to_clipboard


# -----------------------------------------------------------------------------
# Paste — US layout
# -----------------------------------------------------------------------------

map ctrl+shift+v paste_from_clipboard
map ctrl+shift+V paste_from_clipboard


# -----------------------------------------------------------------------------
# Copy — RU layout
# -----------------------------------------------------------------------------
#
# Physical C key:
#   US: c
#   RU: с

map ctrl+shift+с copy_to_clipboard
map ctrl+shift+С copy_to_clipboard


# -----------------------------------------------------------------------------
# Paste — RU layout
# -----------------------------------------------------------------------------
#
# Physical V key:
#   US: v
#   RU: м

map ctrl+shift+м paste_from_clipboard
map ctrl+shift+М paste_from_clipboard


# =============================================================================
# Terminal control keys — RU layout
# =============================================================================
#
# Ctrl+C and Ctrl+D are control characters interpreted by the shell/TTY.
#
# With a Russian keyboard layout the physical keys produce Cyrillic symbols,
# therefore explicit mappings preserve the expected terminal behaviour.


# -----------------------------------------------------------------------------
# Ctrl+C / SIGINT
# -----------------------------------------------------------------------------
#
# Physical C key:
#   US: c
#   RU: с

map ctrl+с send_text all \x03
map ctrl+С send_text all \x03


# -----------------------------------------------------------------------------
# Ctrl+D / EOF
# -----------------------------------------------------------------------------
#
# Physical D key:
#   US: d
#   RU: в

map ctrl+в send_text all \x04
map ctrl+В send_text all \x04


# =============================================================================
# Tabs
# =============================================================================

# Override Kitty's normal "new tab" shortcut so that a new tab starts in the
# same working directory as the current terminal.
map ctrl+shift+t launch --type=tab --cwd=current


# =============================================================================
# Configuration management
# =============================================================================

# Reload kitty.conf without restarting Kitty.
map ctrl+shift+f5 load_config_file

# Display the effective Kitty configuration and environment.
#
# Useful when debugging font selection, key mappings or inherited settings.
map ctrl+shift+f6 debug_config


# =============================================================================
# Notifications — enable after Dunst configuration
# =============================================================================
#
# Kitty shell integration can notify us when a long-running command finishes
# while its terminal is not currently visible.
#
# This is intentionally disabled until the notification daemon is configured.
#
# Later we can enable:
#
# notify_on_cmd_finish invisible 10.0


# =============================================================================
# Deliberately omitted options
# =============================================================================
#
# PERFORMANCE TWEAKS
#
#   repaint_delay, input_delay and sync_to_monitor are left at Kitty defaults.
#   Modern Kitty is already extremely responsive. Sacrificing power usage or
#   introducing rendering problems for theoretical latency improvements is not
#   justified on a stable workstation.
#
#
# TRANSPARENCY
#
#   Transparency is deliberately disabled. If we want it later, it should be
#   designed together with Picom instead of independently tweaking individual
#   applications.
#
#
# BACKGROUND IMAGE
#
#   A terminal is a work surface. No background image.
#
#
# REMOTE CONTROL
#
#   Kitty remote-control sockets are not enabled because we currently have no
#   workflow that requires them.
#
#
# CUSTOM TERM VALUE
#
#   TERM remains xterm-kitty. Changing it can break terminal capability
#   detection and should not be used as an SSH compatibility workaround.
#
# =============================================================================