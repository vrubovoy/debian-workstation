# Kitty — Graphite Blue.


# =============================================================================
# Font
# =============================================================================

# Bold is the regular weight on purpose, so text a program asks to be bold is
# drawn in Italic rather than as a bolder bold. Nerd Font icons (eza, Yazi,
# Fastfetch) come from Kitty's built-in symbol fallback, not a patched font.
font_family      Ubuntu Mono Bold
bold_font        Ubuntu Mono Italic
italic_font      Ubuntu Mono Italic
bold_italic_font Ubuntu Mono Bold Italic
font_size 16.0


# =============================================================================
# Cursor
# =============================================================================

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5 ease-in-out

# The trail helps follow long jumps; 50 ms skips tiny movements.
cursor_trail 50
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2


# =============================================================================
# Window
# =============================================================================

window_padding_width 14
hide_window_decorations yes
background_opacity 1.0

# Ask before closing only while a command is running (needs shell integration).
confirm_os_window_close -1

enable_audio_bell no
visual_bell_duration 0.0

scrollback_lines 10000
pixel_scroll yes
scrollback_fill_enlarged_window yes

shell_integration enabled

# Notify through Dunst when a command running for 10+ seconds finishes in a
# window that is not visible.
notify_on_cmd_finish invisible 10.0


# =============================================================================
# Selection, clipboard and links
# =============================================================================

# Mouse selections stay in PRIMARY; the clipboard is Ctrl+Shift+C only.
copy_on_select no
strip_trailing_spaces smart
paste_actions quote-urls-at-prompt,confirm

detect_urls yes
url_style single
allow_hyperlinks yes


# =============================================================================
# Tab bar
# =============================================================================

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_max_length 36

# The window count is shown only for tabs with more than one window.
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

active_tab_foreground   #111318
active_tab_background   #7AA2F7
active_tab_font_style   bold
inactive_tab_foreground #8E98A8
inactive_tab_background #1A1D24
inactive_tab_font_style normal
tab_bar_background      #111318


# =============================================================================
# Colors
# =============================================================================

foreground #E6E9EF
background #111318

selection_foreground #E6E9EF
selection_background #303744

cursor            #7AA2F7
cursor_text_color #111318

url_color #7AA2F7

active_border_color   #7AA2F7
inactive_border_color #303744
bell_border_color     #E06C75

# ANSI: normal / bright
color0  #1A1D24
color8  #5C6370

color1  #E06C75
color9  #F07178

color2  #98C379
color10 #B5E890

color3  #E5C07B
color11 #FFD580

color4  #7AA2F7
color12 #89B4FA

color5  #C678DD
color13 #D2A6FF

color6  #56B6C2
color14 #7DCFFF

color7  #C8CCD4
color15 #E6E9EF


# =============================================================================
# Keys
# =============================================================================

# With the Russian layout the same physical keys produce Cyrillic letters
# (C → с, V → м, D → в), so copy, paste, Ctrl+C and Ctrl+D are mapped for both.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+C copy_to_clipboard
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+С copy_to_clipboard

map ctrl+shift+v paste_from_clipboard
map ctrl+shift+V paste_from_clipboard
map ctrl+shift+м paste_from_clipboard
map ctrl+shift+М paste_from_clipboard

# Ctrl+C copies when text is selected and interrupts the program otherwise.
map ctrl+c copy_or_interrupt
map ctrl+с copy_or_interrupt
map ctrl+С copy_or_interrupt

map ctrl+в send_text all \x04
map ctrl+В send_text all \x04

# New tabs open in the current directory.
map ctrl+shift+t launch --type=tab --cwd=current

map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
