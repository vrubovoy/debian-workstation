# =============================================================================
# Starship — prompt
# =============================================================================
#
# The current directory on its own line, then only ❯ where the command is
# typed. Git state stays out of the prompt.
#
# Path:  ~/.config/starship.toml

add_newline = false

format = """
$directory
$character"""

[directory]
style = "bold #7AA2F7"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncate_to_repo = false
read_only = " ro"

[character]
success_symbol = "[❯](bold #7AA2F7)"
error_symbol = "[❯](bold #E06C75)"
