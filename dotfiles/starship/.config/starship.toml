# Starship — one line: directory, Git branch and status, prompt character.
# No right prompt, so nothing extra ends up in copied command lines.

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character"""

right_format = ""

[directory]
style = "bold #7AA2F7"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = true
read_only = " ro"

[git_branch]
symbol = "git:"
style = "bold #8E98A8"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #E5C07B"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[character]
success_symbol = "[❯](bold #7AA2F7)"
error_symbol = "[❯](bold #E06C75)"
vimcmd_symbol = "[❮](bold #7AA2F7)"
vimcmd_replace_one_symbol = "[❮](bold #C678DD)"
vimcmd_replace_symbol = "[❮](bold #C678DD)"
vimcmd_visual_symbol = "[❮](bold #E5C07B)"

[cmd_duration]
disabled = true

[time]
disabled = true
