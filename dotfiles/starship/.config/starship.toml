# ******************************************************************************
# @file    starship.toml
# @author  Vrubovoy (github.com/vrubovoy)
# @brief   Starship prompt: the directory on its own line, then the input line.
# @path    ~/.config/starship.toml
# ******************************************************************************
# Copyright (c) 2026 Vrubovoy. MIT License, see LICENSE.
# ******************************************************************************

add_newline = false

format = """
$directory
$character"""

[directory]
style = "#7AA2F7"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncate_to_repo = false
read_only = " ro"

[character]
success_symbol = "[❯](#7AA2F7)"
error_symbol = "[❯](#E06C75)"
