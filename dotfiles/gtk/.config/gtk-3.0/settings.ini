# =============================================================================
# GTK 3 settings
# =============================================================================
#
# Debian workstation graphical appearance.
#
# Theme:
#   Graphite Blue layered over Debian's Adwaita-dark base.
#
# =============================================================================

[Settings]

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1


# -----------------------------------------------------------------------------
# Icons
# -----------------------------------------------------------------------------

gtk-icon-theme-name=Adwaita


# -----------------------------------------------------------------------------
# Typography
# -----------------------------------------------------------------------------

gtk-font-name=Ubuntu Bold 13


# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24


# -----------------------------------------------------------------------------
# Interaction
# -----------------------------------------------------------------------------

gtk-enable-animations=1

# Clicking somewhere on a scrollbar should page toward that location rather
# than immediately jumping the slider there.
gtk-primary-button-warps-slider=0