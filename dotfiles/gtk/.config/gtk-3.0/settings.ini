# GTK 3: Adwaita-dark with the Graphite Blue overrides in gtk.css. The same
# values are applied as GSettings by scripts/install/user.sh.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-font-name=Ubuntu Bold 13
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=1

# Clicking the scrollbar trough pages toward the click instead of jumping there.
gtk-primary-button-warps-slider=0
