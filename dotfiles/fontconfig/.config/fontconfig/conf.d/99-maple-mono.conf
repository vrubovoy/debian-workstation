<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  =============================================================================
  Fontconfig — Maple Mono
  =============================================================================

  Maple Mono NR NF stands in for every generic family, and plain text uses its
  Bold.

  Path:  ~/.config/fontconfig/conf.d/99-maple-mono.conf
  Apply: fc-cache -f, then restart the programs
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <!-- qual="all" also covers requests that name no weight at all. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Maple Mono NR NF</string>
    </test>
    <test name="weight" qual="all" compare="less_eq">
      <const>medium</const>
    </test>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>
</fontconfig>
