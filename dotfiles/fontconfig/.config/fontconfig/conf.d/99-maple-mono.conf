<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ******************************************************************************
  @file    99-maple-mono.conf
  @author  Vrubovoy (github.com/vrubovoy)
  @brief   Maple Mono NR NF for every generic family, Bold as plain weight.
  @path    ~/.config/fontconfig/conf.d/99-maple-mono.conf
  @apply   fc-cache -f, then restart the programs
  ******************************************************************************
  Copyright (c) 2026 Vrubovoy. MIT License, see LICENSE.
  ******************************************************************************
-->

<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer><family>Maple Mono NR NF</family></prefer>
  </alias>

  <!-- qual="all" also covers requests that name no weight at all. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Maple Mono NR NF</string>
    </test>
    <test name="weight" qual="all" compare="less_eq">
      <const>medium</const>
    </test>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>
</fontconfig>
